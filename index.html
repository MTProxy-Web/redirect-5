<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>Redirect</title>
</head>
<body>
  <noscript>Включите JavaScript для перехода.</noscript>
  <script>
    const target = new URL('https://mtproxy.tg/');
    const random = new Uint32Array(2);
    crypto.getRandomValues(random);
    const refresh = Date.now().toString(36) + "-" + Array.from(random, value => value.toString(36)).join("-");
    const search = window.location.search.slice(1).split("&").filter(part => part.split("=", 1)[0] !== "_mtproxy_refresh").join("&");
    target.search = (search ? "?" + search + "&" : "?") + "_mtproxy_refresh=" + refresh;
    target.hash = window.location.hash;
    window.location.replace(target.href);
  </script>
</body>
</html>
